name: CI - KarsaJobs UI

on:
  push:
    branches: [ "karsajobs-ui" ]
  pull_request:
    branches: [ "karsajobs-ui" ]

permissions:
  contents: read
  packages: write

jobs:
  lint-dockerfile:
    name: lint-dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint (via Docker)
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile

  build-app-karsajobs-ui:
    name: build-app-karsajobs-ui
    runs-on: ubuntu-latest
    needs: lint-dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mfaiqrofifi/karsajobs-ui:latest
            ghcr.io/mfaiqrofifi/karsajobs-ui:${{ github.sha }}
